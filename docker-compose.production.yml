name: triven-cinema

services:
  api:
    image: triven-cinema-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
    init: true
    restart: unless-stopped
    stop_grace_period: 10m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
        TRIVEN_INTERNAL_API_URL: http://api:8000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      TRIVEN_INTERNAL_API_URL: http://api:8000
    expose:
      - "3000"
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  maintenance:
    image: triven-cinema-api:local
    env_file:
      - .env
    command:
      - /bin/sh
      - -c
      - set -eu; while true; do python /app/scripts/backup_state.py; python /app/scripts/cleanup_storage.py --apply; sleep 21600; done
    volumes:
      - ./storage:/app/storage
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
