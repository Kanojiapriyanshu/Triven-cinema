services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - triven-storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
        TRIVEN_INTERNAL_API_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: ""
      TRIVEN_INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  triven-storage:
