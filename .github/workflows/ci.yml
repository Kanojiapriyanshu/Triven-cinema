name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install ffmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
      - name: Run the test suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  web:
    name: Web (lint, types, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Next generates global route types (LayoutProps, ...) on demand; a clean checkout does not have them yet.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TRIVEN_INTERNAL_API_URL: http://api:8000

  docker:
    name: Docker images and container smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: |
          cp .env.production.example .env
          docker compose -f docker-compose.production.yml config --quiet

      - name: Build API image
        run: docker build -f Dockerfile.api -t triven-cinema-api:ci --build-arg GIT_SHA=${{ github.sha }} .

      - name: Build web image
        run: docker build -t triven-cinema-web:ci --build-arg GIT_SHA=${{ github.sha }} apps/web

      - name: API refuses to start in production without a signing secret
        run: |
          set +e
          docker run --rm -e APP_ENV=production -e DEBUG=false -e DEMO_AUTH_SHOW_OTP=true \
            -e ENABLE_SYNC_RENDER_ENDPOINTS=false triven-cinema-api:ci > startup.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -0 $pid 2>/dev/null && { echo "container kept running without TRIVEN_SECRET_KEY"; cat startup.log; exit 1; }
          grep -q "refusing to start" startup.log || { cat startup.log; echo "expected the unsafe-configuration error"; exit 1; }
          echo "OK: unsafe production configuration is rejected"

      - name: API container is healthy and unprivileged
        run: |
          docker run -d --name api -p 8000:8000 \
            -e APP_ENV=production -e DEBUG=false \
            -e TRIVEN_SECRET_KEY=ci-only-secret-key-0123456789abcdef0123456789 \
            -e DEMO_AUTH_SHOW_OTP=true -e ENABLE_SYNC_RENDER_ENDPOINTS=false \
            triven-cinema-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready | grep -q '"status":"ready"'
          # `docker exec` starts a NEW process as the image default user (root). The API itself is PID 1 and
          # must be unprivileged: /proc/1 is owned by the user the process runs as.
          echo "API process runs as: $(docker exec api stat -c %U /proc/1)"
          test "$(docker exec api stat -c %U /proc/1)" = "triven"
          docker exec api ffprobe -version | head -1
          # Studio APIs are behind the login gate.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/elements)" = "401"
          echo "OK: ready, non-root, login gate active"

      - name: Web container is healthy and unprivileged
        run: |
          docker run -d --name web -p 3000:3000 triven-cinema-web:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/ | grep -qi "Triven"
          test "$(docker exec web id -u)" != "0"
          echo "OK: web is up and non-root"

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs api 2>&1 | tail -60 || true
          docker logs web 2>&1 | tail -60 || true
